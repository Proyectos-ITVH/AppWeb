{% load static %}

<div class="sidebar-header">
    <h2><i class="fas fa-water"></i> AcuaTech</h2>
    <button class="sidebar-close-btn" id="closeSidebar">
        <i class="fas fa-times"></i>
    </button>
</div>

<div class="navbar-nav" style="flex-grow: 1; display: flex; flex-direction: column;">
    <ul style="flex-grow: 1;">
        <li>
            <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <i class="fas fa-home"></i> Dashboard
            </a>
        </li>

        {% if request.session.user.rolUser == 'admin' %}
            <li class="menu-label" style="padding: 1rem 1.5rem 0.5rem; font-size: 0.75rem; color: var(--text-muted); font-weight: bold; letter-spacing: 1px;">ADMINISTRACIÓN</li>
            
            <li>
                <a href="{% url 'usuarios' %}" class="{% if request.resolver_match.url_name == 'usuarios' %}active{% endif %}">
                    <i class="fas fa-users"></i> Usuarios
                </a>
            </li>

            <li>
                <a href="{% url 'informes' %}" class="{% if request.resolver_match.url_name == 'informes' %}active{% endif %}">
                    <i class="fas fa-chart-bar"></i> Informes
                </a>
            </li>
            
            <li>
                <a href="{% url 'historial' %}" class="{% if request.resolver_match.url_name == 'historial' %}active{% endif %}">
                    <i class="fas fa-history"></i> Historial
                </a>
            </li>
            
            <li>
                <a href="{% url 'ajustes' %}" class="{% if request.resolver_match.url_name == 'ajustes' %}active{% endif %}">
                    <i class="fas fa-cog"></i> Ajustes
                </a>
            </li>
        {% endif %}
    </ul>
</div>

<div class="sidebar-user-footer">
    <div class="user-info">
        <i class="fas fa-user-circle user-avatar"></i>
        <span class="user-name">{{ request.session.user.nombre_display|default:"Usuario" }}</span>
    </div>
    <div class="user-actions">
        <a href="{% url 'perfil' %}" class="action-btn" title="Mi perfil">
            <i class="fas fa-user-cog"></i>
        </a>
        <a href="{% url 'logout' %}" class="action-btn btn-logout" title="Cerrar sesión">
            <i class="fas fa-sign-out-alt"></i>
        </a>
    </div>
</div>
