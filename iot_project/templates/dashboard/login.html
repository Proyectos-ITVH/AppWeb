{% load static %} 
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de sesión</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body class="login-page">
  <div class="login-container">
    <div class="login-header">
      <h2>Iniciar Sesión</h2>
      <p>Accede a tu cuenta para gestionar el sistema IoT</p>
    </div>

    <form id="loginForm" method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tucorreo@dominio.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="switch-container">
        <label class="switch">
          <input type="checkbox" id="remember" name="remember">
          <span class="slider"></span>
        </label>
        <label for="remember" style="margin-bottom: 0;">Recordarme</label>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span>Ingresar</span>
      </button>

      {% if error %}
        <div id="mensaje" class="message error" style="display: block;">
          {{ error }}
        </div>
      {% endif %}


      <div class="links">
        <a href="recuperar-contrasenal.html" id="forgotPassword">¿Olvidaste tu contraseña?</a>
        <a href="{% url 'register' %}" id="registerLink">Registrarse</a>
      </div>
    </form>
  </div>

  </body>
</html>
